import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.27.0'
}

group = 'com.orhoj.trackunit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def registerOpenApiTask(String fileName, String apiName) {
	def taskName = "generateOpenApi_${apiName}"
	def outDir = layout.buildDirectory.dir("generated/${apiName}")

	def task = tasks.register(taskName, GenerateTask) {
		generatorName.set("java")
		library.set("restclient")
		inputSpec.set(layout.projectDirectory.file("src/main/resources/openapi/${fileName}").asFile.path)
		outputDir.set(outDir.get().asFile.path)
		apiPackage.set("com.orhoj.demo.${apiName}.api")
		modelPackage.set("com.orhoj.demo.${apiName}.model")
		invokerPackage.set("com.orhoj.demo.${apiName}.invoker")
		configOptions.set([
				useJakartaEe: "true"
		])
	}

	sourceSets.main.java.srcDir(outDir.map { it.dir("src/main/java") })
	tasks.named("compileJava") { dependsOn(task) }
}


registerOpenApiTask("hire-manager-openapi.yaml", "hiremanager")
registerOpenApiTask("rental-api.json", "rentalapi")
